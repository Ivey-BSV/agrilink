name: cap
description: "CAP - Collective Action Program for regenerative agriculture"
publish_to: 'none'

version: 1.0.7+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  go_router: ^13.2.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  flutter_staggered_grid_view: ^0.7.0
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.10.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.test
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
